version: 2
updates:
  - package-ecosystem: pip
    directory: /
    labels:
      - dependencies
      - python
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: npm
    directory: /
    labels:
      - dependencies
      - javascript
      - npm
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - github_actions
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      codeql-actions:
        patterns:
          - github/codeql-action/*

  - package-ecosystem: pre-commit # zizmor: ignore[dependabot-cooldown]
    directory: /
    labels:
      - dependencies
      - dev
    schedule:
      interval: daily
